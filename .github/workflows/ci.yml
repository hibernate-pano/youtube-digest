name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run test suites
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A real PostgreSQL server. The store's SQL used to be validated by a
    # test double that answered from the SHAPE of the statement, so it
    # could not tell an executable statement from a broken one. Two
    # statements that Postgres rejects shipped to production while a
    # hundred tests stayed green. The store now runs against a real
    # server, and this is the server it runs against.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # The extension suite guards product-UI regressions (emoji bans, provider
      # key isolation, sync merge semantics). It previously only ran indirectly
      # through `npm run package`, so a failing test could not fail the build.
      - name: Test extension
        run: npm test

      # The server suite needs its own dependencies: the `pg` client that
      # drives the real PostgreSQL service above.
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      # The server suite covers the Worker: auth, per-account isolation, the
      # vocabulary ownership gate, and the MemoryStore/NeonStore contract.
      # YTD_TEST_DATABASE_URL turns on the real-PostgreSQL suite; without it
      # those tests are skipped rather than silently passed.
      - name: Test Worker backend
        run: npm test
        working-directory: server
        env:
          YTD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres_test

  release-check:
    name: Validate public extension package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # The release check has its own step, so a broken prompt file or a
      # drifted manifest fails the build with its own message instead of
      # surfacing as a confusing packaging error.
      - name: Run the release check
        run: npm run check

      - name: Build allowlisted ZIP
        run: npm run package

      - name: Show packaged files
        run: unzip -Z1 dist/youtube-digest-v*.zip

      # Listing the archive is not enough: the ZIP has to contain exactly the
      # allowlisted files, nothing missing and nothing extra.
      - name: Verify the packaged file list
        run: |
          expected="$(bash scripts/check-release.sh --print-files | LC_ALL=C sort)"
          actual="$(unzip -Z1 dist/youtube-digest-v*.zip | LC_ALL=C sort)"
          if [ "$expected" != "$actual" ]; then
            echo "The ZIP contents do not match the release file list" >&2
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") >&2 || true
            exit 1
          fi
          echo "The ZIP contains exactly the allowlisted files."
