name = "youtube-digest-server"
main = "src/entry.mjs"
compatibility_date = "2026-08-01"

# Account id is read from wrangler login / CLOUDFLARE_ACCOUNT_ID at deploy time.
# vars are NOT secrets; put GITHUB_CLIENT_SECRET and DATABASE_URL in .dev.vars
# locally and as Worker secrets in production.
[vars]
GITHUB_CLIENT_ID = ""
APP_BASE_URL = "http://localhost:8787"

# Production secrets (set with: wrangler secret put GITHUB_CLIENT_SECRET ...):
#   GITHUB_CLIENT_SECRET
#   JWT_SECRET
#   DATABASE_URL (Neon connection string; omit to run the in-memory dev store)
