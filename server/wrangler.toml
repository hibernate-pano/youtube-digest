name = "youtube-digest-server"
main = "src/entry.mjs"
compatibility_date = "2026-08-01"

# Health probe every 5 minutes (scheduled handler in src/index.js).
[triggers]
crons = ["*/5 * * * *"]

# Custom domain is managed via the Cloudflare dashboard / API
# (CNAME ytd.panbo.space -> youtube-digest-server.panbo362472407.workers.dev
# plus a zone worker route). No routes block here on purpose.

# User dashboard: static assets served from the same origin as the API.
# /api/* runs the Worker first; everything else is served from Assets.
[assets]
directory = "./dashboard"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Account id is read from wrangler login / CLOUDFLARE_ACCOUNT_ID at deploy time.
#
# No [vars] block here on purpose. Everything the Worker reads from `env` is
# a secret, set with `wrangler secret put` (see SETUP.md, "Deploy"):
#   GITHUB_CLIENT_ID      the OAuth App's client id
#   GITHUB_CLIENT_SECRET  the OAuth App's client secret
#   JWT_SECRET            32+ random characters
#   DATABASE_URL          the Neon connection string
# A client id in [vars] would be committed to git, and the deploy would still
# fail until the other three exist. Set all four secrets BEFORE `wrangler
# deploy`: a Worker deployed without them answers every request with a 500.
#
# For local development, copy server/.dev.vars.example to server/.dev.vars and
# fill it in (that file is gitignored).
